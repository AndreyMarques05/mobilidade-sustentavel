# Pacote com as classes de passos, hooks e tipos de parametro
cucumber.glue=br.com.fiap.mobilidade.apitests

# Saida no console + relatorios HTML, JSON e JUnit XML em target/cucumber-report
cucumber.plugin=pretty, summary, html:target/cucumber-report/index.html, json:target/cucumber-report/cucumber.json, junit:target/cucumber-report/cucumber-junit.xml

cucumber.publish.quiet=true

# Cenarios marcados como @defeito-conhecido documentam falhas reais da API
# que ainda nao foram corrigidas. Ficam fora da execucao padrao para nao
# travar o pipeline; rode-os com -Dcucumber.filter.tags="@defeito-conhecido".
cucumber.filter.tags=not @defeito-conhecido
