# ================================================================
# Perfil STAGING — ambiente de homologação
# Sobe com dados de teste e documentação aberta, para validação manual
# antes da promoção para produção.
# ================================================================

# Swagger liberado: o time usa para testar os endpoints em homologação
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Log mais verboso para investigar problemas antes de ir para produção
logging.level.br.com.fiap.mobilidade=DEBUG
spring.jpa.show-sql=true

# Health check detalhado: o pipeline inspeciona o estado de cada componente
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Flyway aplica as migrations automaticamente em homologação
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
