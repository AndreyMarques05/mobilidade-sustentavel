# ================================================================
# Perfil PROD — ambiente de produção
# Superfície mínima exposta e logs enxutos.
# ================================================================

# Documentação desligada: em produção o Swagger não fica público
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Log apenas do que importa operar
logging.level.root=WARN
logging.level.br.com.fiap.mobilidade=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Health check sem detalhes internos para quem não está autenticado
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Em produção o schema nunca é alterado pela aplicação: Flyway versiona,
# o Hibernate apenas valida o que encontrou.
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate

# Mensagens de erro não vazam detalhes internos
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
