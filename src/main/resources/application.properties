# ================================================================
# Mobilidade Sustentável - Configurações da Aplicação
# ================================================================

spring.application.name=mobilidade-sustentavel

# ----------------------------------------------------------------
# Datasource Oracle
# ----------------------------------------------------------------
spring.datasource.url=jdbc:oracle:thin:@${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_SERVICE:XEPDB1}
spring.datasource.username=${ORACLE_USER:mobilidade}
spring.datasource.password=${ORACLE_PASSWORD:mobilidade123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ----------------------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ----------------------------------------------------------------
# Flyway
# ----------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ----------------------------------------------------------------
# JWT
# ----------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:mobilidade-sustentavel-secret-key-fiap-2024-muito-longa-para-seguranca}
app.jwt.expiration-ms=86400000

# ----------------------------------------------------------------
# Swagger / OpenAPI
# ----------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ----------------------------------------------------------------
# Servidor
# ----------------------------------------------------------------
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
